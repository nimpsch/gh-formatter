[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gh-formatter"
dynamic = ["version"]
description = "A formatting tool for GitHub Workflows and Actions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Sebastian Nimpsch" },
]
keywords = [
    "github-actions",
    "workflows",
    "formatter",
    "linter",
    "yaml",
    "ci",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "ruamel.yaml>=0.17.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "yamllint>=1.35.0",
]

[project.urls]
Homepage = "https://github.com/nimpsch/gh-formatter"
Issues = "https://github.com/nimpsch/gh-formatter/issues"
Changelog = "https://github.com/nimpsch/gh-formatter/releases"

[project.scripts]
gh-formatter = "gh_formatter.cli:main"

[tool.hatch.version]
path = "src/gh_formatter/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gh_formatter"]

[tool.black]
line-length = 80
target-version = ['py311']

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",      # Pyflakes
    "I",      # isort
    "D",      # pydocstyle
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
]
ignore = [
    "D100",   # Missing docstring in public module
    "D101",   # Missing docstring in public class
    "D102",   # Missing docstring in public method
    "D103",   # Missing docstring in public function
    "D104",   # Missing docstring in public package
    "D105",   # Missing docstring in magic method
    "D107",   # Missing docstring in __init__
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D",      # Ignore docstrings in tests
    "E501",   # Ignore line length in tests
    "E741",   # Ignore ambiguous variable name in tests (like 'l')
    "W291",   # Ignore trailing whitespaces in tests
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/", ".venv/"]
