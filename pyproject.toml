[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gh-formatter"
dynamic = ["version"]
description = "A formatting tool for GitHub Workflows and Actions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Sebastian Nimpsch" },
]
keywords = [
    "github-actions",
    "workflows",
    "formatter",
    "linter",
    "yaml",
    "ci",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "ruamel.yaml>=0.19.1",
    "pygls>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "black>=26.5.1",
    "ruff>=0.15.22",
    "mypy>=2.3.0",
    "yamllint>=1.38.0",
]

[project.urls]
Homepage = "https://github.com/nimpsch/gh-formatter"
Issues = "https://github.com/nimpsch/gh-formatter/issues"
Changelog = "https://github.com/nimpsch/gh-formatter/releases"

[project.scripts]
gh-formatter = "gh_formatter.cli:main"
gh-formatter-lsp = "gh_formatter.lsp.server:main"

[tool.hatch.version]
path = "src/gh_formatter/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gh_formatter"]

[tool.black]
line-length = 80
target-version = ['py311']

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # Pyflakes
    "I",        # isort
    "D",        # pydocstyle
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C90",      # mccabe: cap cyclomatic complexity (see max-complexity below)
    "PLR0912",  # too many branches (nested if/else chains)
    "PLR0915",  # too many statements (oversized functions)
]
ignore = [
    "D100",   # Missing docstring in public module
    "D101",   # Missing docstring in public class
    "D102",   # Missing docstring in public method
    "D103",   # Missing docstring in public function
    "D104",   # Missing docstring in public package
    "D105",   # Missing docstring in magic method
    "D107",   # Missing docstring in __init__
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "D",        # Ignore docstrings in tests
    "E501",     # Ignore line length in tests
    "E741",     # Ignore ambiguous variable name in tests (like 'l')
    "W291",     # Ignore trailing whitespaces in tests
    "C901",     # Tests may be long/branchy; complexity caps are for src only
    "PLR0912",
    "PLR0915",
]

[tool.ruff.lint.mccabe]
# Functions above this cyclomatic complexity are flagged (C901). Keeps
# oversized, deeply nested functions out of the codebase.
max-complexity = 10

[tool.ruff.lint.isort]
# Pin first-party detection so import grouping is identical across ruff
# versions and machines, avoiding spurious I001 churn.
known-first-party = ["gh_formatter"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["tests/", ".venv/"]
