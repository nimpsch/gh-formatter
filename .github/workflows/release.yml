name: Release

on:
  push:
    tags:
    - "v*"

jobs:
  test:
    name: Run linting and tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install package with dev dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Check formatting
      run: gh-formatter --check .

    - name: Run tests
      run: pytest

  build:
    name: Build distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Verify tag matches package version
      run: |
        TAG_VERSION="${GITHUB_REF_NAME#v}"
        PKG_VERSION="$(python -c "import re, pathlib; print(re.search(r'__version__ = \"(.+?)\"', pathlib.Path('src/gh_formatter/__init__.py').read_text()).group(1))")"
        if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
          echo "Tag version ($TAG_VERSION) does not match package version ($PKG_VERSION)" >&2
          exit 1
        fi

    - name: Install build tooling
      run: python -m pip install --upgrade pip build twine

    - name: Build sdist and wheel
      run: python -m build

    - name: Check distribution metadata
      run: twine check dist/*

    - name: Upload distribution artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:  # Required for PyPI Trusted Publishing (OIDC)
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/gh-formatter
    steps:
    - name: Download distribution artifacts
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  github_release:
    name: Create GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download distribution artifacts
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/

    - name: Create release with artifacts
      uses: softprops/action-gh-release@v3
      with:
        files: dist/*
        generate_release_notes: true
